<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Disney - Repositorios</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #090b13 0%, #1a1d29 100%);
      color: #f9f9f9;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a2a8b9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .header p {
      color: #f9f9f980;
      font-size: 1rem;
      margin-top: 8px;
    }

    /* Buscador mágico */
    .search-container {
      max-width: 600px;
      margin: 0 auto 40px auto;
      display: flex;
      gap: 12px;
    }

    .search-container input {
      flex: 1;
      padding: 14px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1rem;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-container input:focus {
      border-color: #0072d2;
      box-shadow: 0 0 15px rgba(0, 114, 210, 0.5);
      background: rgba(255, 255, 255, 0.12);
    }

    /* Galería de Tarjetas / Pósters */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .movie-card {
      background: #192133;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 3px solid transparent;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      transition: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .movie-card:hover {
      transform: scale(1.06);
      border-color: rgba(249, 249, 249, 0.8);
      box-shadow: 0 18px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .poster-wrapper {
      width: 100%;
      height: 260px;
      background-color: #0c111b;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .movie-card:hover .poster-wrapper img {
      transform: scale(1.08);
    }

    .card-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .card-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #fff;
      text-transform: capitalize;
    }

    .card-info p {
      font-size: 0.85rem;
      color: #a2a8b9;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .card-tags {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .lang-tag {
      background: rgba(0, 114, 210, 0.2);
      color: #00d2ff;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .stars-tag {
      color: #ffc107;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: #a2a8b9;
      padding: 50px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Colección de Repositorios</h1>
    <p>Explora el catálogo oficial de proyectos</p>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar título o categoría...">
  </div>

  <div class="catalog-grid" id="catalogGrid">
  </div>

  <script>
    const USERNAME = 'mateo1288';

    const allRepos = [
      {
        name: 'recursividad',
        description: 'Ejercicios y lógica de recursividad',
        language: 'Python',
        stars: 0,
        image: 'recursibidad-.png'
      },
      {
        name: 'graficas',
        description: 'Visualización de datos e histogramas',
        language: 'Python',
        stars: 0,
        image: 'graficas.png'
      },
      {
        name: 'CSV',
        description: 'Gestión de datos de usuarios',
        language: 'Python',
        stars: 0,
        image: 'CSV.png'
      },
      {
        name: 'prueba',
        description: 'Repositorio de evaluaciones',
        language: 'Python',
        stars: 0,
        image: 'examen.jfif'
      },
      {
        name: 'IA',
        description: 'Inteligencia artificial',
        language: 'Python',
        stars: 0,
        image: 'ia.png'
      }
    ];

    function renderCatalog(repos) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      if (repos.length === 0) {
        grid.innerHTML = `<div class="no-results">No se encontraron títulos.</div>`;
        return;
      }

      repos.forEach(repo => {
        const repoUrl = `https://github.com/${USERNAME}/${repo.name}`;
        
        const card = document.createElement('a');
        card.className = 'movie-card';
        card.href = repoUrl;
        card.target = '_blank';

        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${repo.image}" alt="${repo.name}" onerror="this.src='https://via.placeholder.com/220x260/192133/ffffff?text=${repo.name}'">
          </div>
          <div class="card-info">
            <div>
              <h3>${repo.name}</h3>
              <p>${repo.description}</p>
            </div>
            <div class="card-tags">
              <span class="lang-tag">${repo.language}</span>
              <span class="stars-tag">★ ${repo.stars}</span>
            </div>
          </div>
        `;
        
        grid.appendChild(card);
      });
    }

    function filterRepos() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allRepos.filter(repo => 
        repo.name.toLowerCase().includes(query) ||
        repo.description.toLowerCase().includes(query) ||
        repo.language.toLowerCase().includes(query)
      );
      renderCatalog(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterRepos);

    renderCatalog(allRepos);
  </script>

</body>
</html>
